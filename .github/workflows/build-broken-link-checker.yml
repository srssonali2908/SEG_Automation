name: Build BrokenLinkChecker.exe

on:
  push:
    paths:
      - "BrokenLinkChecker/**"
      - ".github/workflows/build-broken-link-checker.yml"
    tags:
      - "blc-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BrokenLinkChecker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BrokenLinkChecker gui.py

      - name: Smoke test link checker
        shell: pwsh
        run: |
          python -c "import link_checker, gui; print('imports ok')"
          if (-not (Test-Path dist/BrokenLinkChecker.exe)) { throw "exe missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: BrokenLinkChecker
          path: BrokenLinkChecker/dist/BrokenLinkChecker.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/blc-v')
        uses: softprops/action-gh-release@v2
        with:
          files: BrokenLinkChecker/dist/BrokenLinkChecker.exe
